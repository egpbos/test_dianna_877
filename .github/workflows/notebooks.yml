name: notebooks

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  run_notebook:
    name: Run tensorflow2onnx notebook (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # Install the CPU-only builds first to avoid pulling in large GPU wheels,
      # mirroring what DIANNA's install-python-and-package action does on Linux.
      - name: Install PyTorch (CPU) and TensorFlow (CPU)
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tensorflow-cpu

      # Install DIANNA together with the same extras used in its notebook CI.
      - name: Install DIANNA with dev and notebooks extras
        run: python -m pip install "dianna[dev,notebooks]"

      - name: Check network connectivity to model download URL
        run: |
          curl -I --max-time 15 \
            'https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_1.0_224_frozen.tgz'

      - name: Run tutorial notebook
        run: pytest --nbmake --nbmake-timeout=600 tutorials/tensorflow2onnx.ipynb

      - name: Inspect Keras cache after notebook run
        if: always()
        run: |
          echo "=== ~/.keras/datasets/ ==="
          ls -lR ~/.keras/datasets/ 2>/dev/null || echo "(directory not found)"
