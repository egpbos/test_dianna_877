name: notebooks

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  run_notebook:
    name: Run tensorflow2onnx notebook (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # Install the CPU-only builds first to avoid pulling in large GPU wheels,
      # mirroring what DIANNA's install-python-and-package action does on Linux.
      - name: Install PyTorch (CPU) and TensorFlow (CPU)
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tensorflow-cpu

      # Install DIANNA from the PR branch that drops the tensorflow<2.16 upper bound,
      # mirroring the exact environment that triggered the issue (newer keras via
      # unconstrained tensorflow-cpu installed above).
      - name: Install DIANNA from PR branch (dianna-ai/dianna#877)
        run: |
          python -m pip install \
            "dianna[dev,notebooks] @ git+https://github.com/dianna-ai/dianna.git@copilot/fix-ci-for-python-3-12"

      - name: Check network connectivity to model download URL
        run: |
          curl -I --max-time 15 \
            'https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_1.0_224_frozen.tgz'

      - name: Run tutorial notebook
        run: pytest --nbmake --nbmake-timeout=600 tutorials/tensorflow2onnx.ipynb

      - name: Inspect Keras cache after notebook run
        if: always()
        run: |
          echo "=== ~/.keras/datasets/ ==="
          ls -lR ~/.keras/datasets/ 2>/dev/null || echo "(directory not found)"

  run_pytorch2onnx_notebook:
    name: Run pytorch2onnx notebook (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # Mirror the DIANNA install-python-and-package action exactly:
      # pin torch AND torchvision from the pytorch CPU index first.
      - name: Install PyTorch (CPU) and TensorFlow (CPU)
        run: |
          python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tensorflow-cpu

      # Two separate pip install steps, matching how install-python-and-package
      # runs "pip install -e .[dev]" then "pip install -e .[notebooks]".
      # The [notebooks] extras list torchvision unpinned, so pip may upgrade it
      # from PyPI (without the CPU index) — that is the environment that triggers
      # the circular-import failure.
      - name: Install DIANNA [dev] from PR branch (dianna-ai/dianna#877)
        run: |
          python -m pip install \
            "dianna[dev] @ git+https://github.com/dianna-ai/dianna.git@copilot/fix-ci-for-python-3-12"

      - name: Install DIANNA [notebooks] from PR branch (dianna-ai/dianna#877)
        run: |
          python -m pip install \
            "dianna[notebooks] @ git+https://github.com/dianna-ai/dianna.git@copilot/fix-ci-for-python-3-12"

      - name: Show installed torch/torchvision/lightning/torchmetrics versions
        if: always()
        run: pip show torch torchvision lightning torchmetrics | grep -E "^(Name|Version):"

      - name: Run tutorial notebook
        run: pytest --nbmake --nbmake-timeout=600 tutorials/pytorch2onnx.ipynb

  run_lime_text_eulaw_notebook:
    name: Run lime_text_eulaw notebook (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # On macOS the DIANNA install-python-and-package action does NOT pre-install
      # CPU-only torch (that path is Linux-only). We mirror the macOS path: install
      # dianna[dev] then dianna[notebooks] as two separate steps, exactly as the
      # action runs "pip install -e .[dev]" then "pip install -e .[notebooks]".
      - name: Install DIANNA [dev] from PR branch (install_openmp_readme)
        run: |
          python -m pip install \
            "dianna[dev] @ git+https://github.com/dianna-ai/dianna.git@install_openmp_readme"

      - name: Install DIANNA [notebooks] from PR branch (install_openmp_readme)
        run: |
          python -m pip install \
            "dianna[notebooks] @ git+https://github.com/dianna-ai/dianna.git@install_openmp_readme"

      # Workaround for xgboost OpenMP issue on macOS (see https://github.com/dmlc/xgboost/pull/12108).
      # Mirrors the step in DIANNA's install_openmp_readme branch workflow.
      - name: Install OpenMP runtime (macOS)
        run: brew install libomp

      - name: Show installed package versions
        if: always()
        run: pip show torch transformers xgboost | grep -E "^(Name|Version):"

      - name: Run tutorial notebook
        run: pytest --nbmake --nbmake-timeout=600 tutorials/lime_text_eulaw.ipynb
